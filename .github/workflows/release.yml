# Publishes a downloadable release automatically whenever a new version of the tool is pushed.
# The version comes from $ToolVersion in MW4-Config-Tool.ps1 - bump it and push, that's it.
name: Release

on:
  push:
    branches: [main]
    paths:
      - 'MW4-Config-Tool.ps1'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: ver
        run: |
          v=$(grep -oP "^\\\$ToolVersion\s*=\s*'\K[^']+" MW4-Config-Tool.ps1 | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "v$v is already released - nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "Releasing v$v"
          fi

      - name: Build download zip
        if: steps.ver.outputs.exists == 'false'
        run: |
          mkdir -p "dist/MW4 Performance Tool/assets"
          cp MW4-Config-Tool.ps1 "Run MW4 Config Tool.bat" README.md "dist/MW4 Performance Tool/"
          cp assets/logo.png assets/game.png "dist/MW4 Performance Tool/assets/"
          cd dist && zip -r MW4-Performance-Tool.zip "MW4 Performance Tool"

      - name: Publish release
        if: steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: g1gGLe'z MW4 Performance Tool v${{ steps.ver.outputs.version }}
          files: dist/MW4-Performance-Tool.zip
          make_latest: true
          generate_release_notes: true
          body: |
            ## Download
            Grab **MW4-Performance-Tool.zip** below, unzip it anywhere, and double-click **Run MW4 Config Tool.bat**.

            Launch Call of Duty once first so it creates its settings files, then close it before applying.

            Join the squad: [Discord](https://discord.gg/Br7z7zBvFb) · [YouTube](https://www.youtube.com/user/FiTHGAMINGOFFICIAL) · [fithgaming.co.uk](http://fithgaming.co.uk/)
