<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1206"/>
      <stop offset="0.38" stop-color="#120b08"/>
      <stop offset="1" stop-color="#0b0d11"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#ff5a1f" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.92" cy="0.95" r="0.45">
      <stop offset="0" stop-color="#ff7b45" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff7b45" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a1f"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="18" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="18" fill="url(#glow)"/>
  <rect width="1280" height="360" rx="18" fill="url(#glow2)"/>

  <!-- reticle -->
  <g transform="translate(1050 170)" fill="none" stroke="#ff5a1f" stroke-linecap="round">
    <circle r="112" stroke-opacity="0.18" stroke-width="2"/>
    <circle r="78" stroke-opacity="0.35" stroke-width="2.5"/>
    <circle r="6" fill="#ff5a1f" stroke="none"/>
    <path d="M0 -140V-92M0 92V140M-140 0H-92M92 0H140" stroke-width="4"/>
    <path d="M-38 -38l-14 -14M38 -38l14 -14M-38 38l-14 14M38 38l14 14" stroke-opacity="0.5" stroke-width="3"/>
  </g>

  <!-- fps meter -->
  <g transform="translate(828 338)" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="15" fill="#8c94a3">
    <text x="0" y="0">FPS</text>
    <g transform="translate(46 -13)">
      <rect width="7" height="16" rx="2" fill="#ff5a1f"/><rect x="11" width="7" height="16" rx="2" fill="#ff5a1f"/>
      <rect x="22" width="7" height="16" rx="2" fill="#ff5a1f"/><rect x="33" width="7" height="16" rx="2" fill="#ff5a1f"/>
      <rect x="44" width="7" height="16" rx="2" fill="#ff5a1f"/><rect x="55" width="7" height="16" rx="2" fill="#ff5a1f"/>
      <rect x="66" width="7" height="16" rx="2" fill="#ff7b45"/><rect x="77" width="7" height="16" rx="2" fill="#ff7b45"/>
      <rect x="88" width="7" height="16" rx="2" fill="#3a2418"/><rect x="99" width="7" height="16" rx="2" fill="#3a2418"/>
    </g>
    <text x="168" y="0" fill="#ff7b45" font-weight="700">MAX</text>
  </g>

  <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif">
    <rect x="64" y="70" width="190" height="30" rx="15" fill="#2a1206" stroke="#ff5a1f"/>
    <text x="159" y="91" text-anchor="middle" font-size="14" font-weight="700" fill="#ff7b45" letter-spacing="2">FiTH GAMING</text>

    <text x="62" y="176" font-size="68" font-weight="900" fill="#ff5a1f" letter-spacing="-1">g1gGLe'z</text>
    <text x="62" y="246" font-size="68" font-weight="900" fill="#ffffff" letter-spacing="-1">MW4 PERFORMANCE</text>

    <rect x="64" y="270" width="420" height="4" rx="2" fill="url(#bar)"/>
    <text x="64" y="306" font-size="20" fill="#b9bfca">Call of Duty: Modern Warfare 4 config tuner. Built for YOUR rig.</text>
    <text x="64" y="334" font-size="14" font-weight="700" fill="#ff7b45" letter-spacing="3">FIRE IN THE HOLE</text>
  </g>
</svg>
